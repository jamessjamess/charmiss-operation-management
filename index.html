<script>
  /* CR-01: Light / Dark / System before the first paint (same key as the header switch) */
  (function () { var m = 'system'; try { m = localStorage.getItem('ops.theme') || 'system'; } catch (e) {}
    var dark = m === 'dark' || (m === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light'); })();
</script>
